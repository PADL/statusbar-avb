# Example batch for statusbar-atdecc-ctl:
#   statusbar-atdecc-ctl --interface=eth0 --command=batch --file=ops.toml
#
# Endpoints are "NAME:UID" where NAME is the entity name (hostname-derived for
# our nodes; e.g. "node-a"), or a raw EUI-64, matched case-insensitively by
# substring against discovered entities. UID is the stream's unique_id
# (0 = AM824, 1 = AAF on the dual audio entity). Order of execution is always:
# all [[connect]], then all [[set_clock_source]], then all [[disconnect]].

# --- Connect all four A<->D streams (both formats, both directions) ---
[[connect]]
talker   = "node-a:0"   # AM824
listener = "node-d:0"

[[connect]]
talker   = "node-a:1"   # AAF
listener = "node-d:1"

[[connect]]
talker   = "node-d:0"   # reverse, AM824
listener = "node-a:0"

[[connect]]
talker   = "node-d:1"   # reverse, AAF
listener = "node-a:1"

# --- Point a third device's clock at our stream ---
# Read the available clock-source indices first with:
#   statusbar-atdecc-ctl --interface=eth0 --command=list --entity=the audio interface
[[set_clock_source]]
entity       = "the audio interface"
clock_domain = 0
clock_source = 1
